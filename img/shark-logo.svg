<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- Halftone shark silhouette - dense body, sparse edges -->
  <!-- Body (dense) -->
  <circle cx="80" cy="50" r="3.5" fill="#111111"/>
  <circle cx="90" cy="45" r="3" fill="#111111"/>
  <circle cx="95" cy="50" r="2.5" fill="#111111"/>
  <circle cx="100" cy="48" r="3" fill="#111111"/>
  <circle cx="105" cy="52" r="2.5" fill="#111111"/>
  <circle cx="110" cy="49" r="3" fill="#111111"/>
  <circle cx="115" cy="51" r="2.5" fill="#111111"/>
  <circle cx="120" cy="48" r="3" fill="#111111"/>
  <circle cx="125" cy="50" r="2.5" fill="#111111"/>
  <circle cx="130" cy="47" r="2.5" fill="#111111"/>
  
  <!-- Upper body -->
  <circle cx="85" cy="40" r="2.5" fill="#111111"/>
  <circle cx="95" cy="35" r="3" fill="#111111"/>
  <circle cx="105" cy="33" r="2.5" fill="#111111"/>
  <circle cx="115" cy="32" r="2.5" fill="#111111"/>
  <circle cx="125" cy="33" r="2.5" fill="#111111"/>
  <circle cx="130" cy="36" r="2" fill="#111111"/>
  <circle cx="135" cy="39" r="2" fill="#111111"/>
  
  <!-- Lower body -->
  <circle cx="85" cy="60" r="2.5" fill="#111111"/>
  <circle cx="95" cy="65" r="3" fill="#111111"/>
  <circle cx="105" cy="67" r="2.5" fill="#111111"/>
  <circle cx="115" cy="68" r="2.5" fill="#111111"/>
  <circle cx="125" cy="67" r="2.5" fill="#111111"/>
  <circle cx="130" cy="64" r="2" fill="#111111"/>
  <circle cx="135" cy="61" r="2" fill="#111111"/>
  
  <!-- Tail (sparse) -->
  <circle cx="140" cy="48" r="2" fill="#111111"/>
  <circle cx="145" cy="44" r="1.5" fill="#111111"/>
  <circle cx="145" cy="52" r="1.5" fill="#111111"/>
  <circle cx="150" cy="42" r="1.5" fill="#111111"/>
  <circle cx="150" cy="54" r="1.5" fill="#111111"/>
  <circle cx="155" cy="40" r="1" fill="#111111"/>
  <circle cx="155" cy="56" r="1" fill="#111111"/>
  <circle cx="160" cy="48" r="1" fill="#111111"/>
  <circle cx="165" cy="48" r="0.8" fill="#111111"/>
  
  <!-- Dorsal fin (sparse) -->
  <circle cx="110" cy="25" r="1.5" fill="#111111"/>
  <circle cx="115" cy="22" r="1.5" fill="#111111"/>
  <circle cx="120" cy="20" r="1" fill="#111111"/>
  <circle cx="125" cy="19" r="1" fill="#111111"/>
  <circle cx="130" cy="19" r="0.8" fill="#111111"/>
  
  <!-- Pectoral fin (sparse) -->
  <circle cx="90" cy="65" r="1.5" fill="#111111"/>
  <circle cx="95" cy="70" r="1.5" fill="#111111"/>
  <circle cx="100" cy="73" r="1" fill="#111111"/>
  <circle cx="105" cy="75" r="1" fill="#111111"/>
  <circle cx="110" cy="76" r="0.8" fill="#111111"/>
  
  <!-- Snout (sparse) -->
  <circle cx="75" cy="48" r="2" fill="#111111"/>
  <circle cx="70" cy="46" r="1.5" fill="#111111"/>
  <circle cx="70" cy="52" r="1.5" fill="#111111"/>
  <circle cx="65" cy="44" r="1" fill="#111111"/>
  <circle cx="65" cy="54" r="1" fill="#111111"/>
  <circle cx="60" cy="48" r="0.8" fill="#111111"/>
  
  <!-- Scattered fade-out dots around edges -->
  <circle cx="55" cy="40" r="0.6" fill="#111111" opacity="0.4"/>
  <circle cx="55" cy="56" r="0.6" fill="#111111" opacity="0.4"/>
  <circle cx="48" cy="48" r="0.5" fill="#111111" opacity="0.3"/>
  <circle cx="170" cy="45" r="0.5" fill="#111111" opacity="0.3"/>
  <circle cx="170" cy="51" r="0.4" fill="#111111" opacity="0.2"/>
  <circle cx="130" cy="15" r="0.4" fill="#111111" opacity="0.3"/>
  <circle cx="135" cy="14" r="0.3" fill="#111111" opacity="0.2"/>
  <circle cx="110" cy="78" r="0.4" fill="#111111" opacity="0.3"/>
  <circle cx="105" cy="79" r="0.3" fill="#111111" opacity="0.2"/>
  <circle cx="80" cy="30" r="0.4" fill="#111111" opacity="0.3"/>
  <circle cx="75" cy="28" r="0.3" fill="#111111" opacity="0.2"/>
  <circle cx="90" cy="78" r="0.4" fill="#111111" opacity="0.3"/>
  <circle cx="85" cy="79" r="0.3" fill="#111111" opacity="0.2"/>
  
  <!-- TM superscript -->
  <text x="170" y="25" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#111111">™</text>
</svg>